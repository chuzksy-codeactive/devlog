name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  api:
    name: API build + test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: |
            api/**/*.csproj
            api/DevLog.slnx

      - name: Restore
        run: dotnet restore api/DevLog.slnx

      - name: Build
        run: dotnet build api/DevLog.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test api/DevLog.slnx --no-build --configuration Release

      - name: Check for vulnerable NuGet packages
        run: |
          dotnet list api/DevLog.slnx package --vulnerable --include-transitive > vuln-report.txt
          cat vuln-report.txt
          if grep -qE "has the following vulnerable packages" vuln-report.txt; then
            echo "::error::Vulnerable NuGet package(s) found — see report above."
            exit 1
          fi

  web:
    name: Frontend build + test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build (structural check only, dummy env)
        env:
          NEXT_PUBLIC_API_BASE_URL: "https://example.invalid"
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "pk_test_ZHVtbXktY2ktdmFsdWUk"
          CLERK_SECRET_KEY: "sk_test_dummy_ci_value_not_real"
        run: npm run build

      - name: Audit dependencies
        run: npm audit --audit-level=high
