name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-api:
    name: Build + publish API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: |
            api/**/*.csproj
            api/DevLog.slnx

      - name: Restore
        run: dotnet restore api/DevLog.slnx

      - name: Test
        run: dotnet test api/DevLog.slnx --configuration Release

      - name: Publish
        run: dotnet publish api/DevLog.Api/DevLog.Api.csproj -c Release -o ./publish

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: api-publish
          path: ./publish

  deploy-api-staging:
    name: Deploy API to staging slot
    needs: build-api
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    outputs:
      webapp_url: ${{ steps.deploy_api.outputs['webapp-url'] }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: api-publish
          path: ./publish

      - uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - id: deploy_api
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383
        with:
          app-name: devlog-api
          slot-name: staging
          package: ./publish

      - run: az logout
        if: always()

  smoke-test-staging:
    name: Smoke-test staging before allowing a swap
    needs: deploy-api-staging
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait for staging /health
        run: |
          url="${{ needs['deploy-api-staging'].outputs.webapp_url }}/health"
          for i in 1 2 3 4 5; do
            status=$(curl -sS -o /dev/null -w "%{http_code}" "$url" || true)
            if [ -z "$status" ]; then
              status="000"
            fi
            if [ "$status" = "200" ]; then
              echo "Staging healthy (attempt $i)."
              exit 0
            fi
            echo "Attempt $i: got HTTP $status, retrying in 10s..."
            sleep 10
          done
          echo "::error::Staging slot never returned a healthy /health response — blocking the swap."
          exit 1

  deploy-frontend:
    name: Deploy frontend (Static Web App)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "web"
          output_location: ""
