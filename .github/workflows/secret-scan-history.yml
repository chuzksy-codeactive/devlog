name: Secret scan (full history)

# Manual only — not something that needs to run on every push. ci.yml's
# secret-scan job already covers "does this PR introduce a new secret" for
# everything going forward; this one instead answers "has anything ever
# been committed to this repo's history that looks like a secret," which is
# only worth checking occasionally (e.g. once now, as a baseline, and again
# any time there's a reason to suspect something old leaked).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Scan entire git history
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.x
        with:
          fetch-depth: 0 # full history, not just the latest commit

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
