name: Swap staging → production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "swap" to confirm — this promotes whatever is currently in the staging slot straight to production.'
        required: true
        type: string

permissions:
  contents: read

jobs:
  swap:
    name: Swap staging into production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Verify confirmation input
        if: inputs.confirm != 'swap'
        run: |
          echo "::error::Confirmation input was '${{ inputs.confirm }}', not 'swap'. Aborting — nothing was touched."
          exit 1

      - uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Swap staging into production
        run: |
          az webapp deployment slot swap \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name devlog-api \
            --slot staging \
            --target-slot production

      - run: az logout
        if: always()
